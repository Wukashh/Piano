<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Layla's Piano</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Layla's Piano">
<meta name="theme-color" content="#255084">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;overflow:hidden}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one screen. A control bar on top, then a piano cabinet: its music stand shows the song, its keys fill the rest. */
:root{
  --sky:#D3ECF3; --sky-2:#E9F6EA; --ink:#17324A; --muted:#4F6B84;
  --panel:#FFFFFF; --panel-edge:#B4CFDB;
  --sun:#FFC83A; --sun-edge:#D2930A; --sun-ink:#3A2A00; --star:#E3A300; --star-off:#C9D3DB;
  --cabinet:#255084; --cabinet-2:#17335F; --cab-edge:#0F2242; --cab-shadow:rgba(15,34,66,.4);
  --paper:#FFFBEF; --paper-ink:#22324A; --paper-muted:#66768A; --paper-line:#E6DEC8;
  --ivory:#FFFDF6; --ivory-2:#EFE8D6; --ivory-edge:#C6BDA6;
  --ebony:#15171D; --ebony-2:#3D4150; --ebony-lip:#2A2D38;
  --n-c:#E5433D; --n-d:#F28A1E; --n-e:#EEC216; --n-f:#69B537; --n-g:#0F9D69; --n-a:#7657C8; --n-b:#DC4F9B;
  --chip-ink:#FFFFFF; --chip-ink-dark:#3A2A00;
  --scrim:rgba(18,40,68,.5); --press-shade:rgba(0,0,0,.32);
  --font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#0E1A2D; --sky-2:#142840; --ink:#EAF4FA; --muted:#9BB4C8;
  --panel:#213655; --panel-edge:#0A1525;
  --cabinet:#2E5894; --cabinet-2:#1C3968; --cab-edge:#081221; --cab-shadow:rgba(0,0,0,.6);
  --star-off:#4A5D78; --scrim:rgba(2,8,18,.68); color-scheme:dark } }
:root[data-theme="dark"]{
  --sky:#0E1A2D; --sky-2:#142840; --ink:#EAF4FA; --muted:#9BB4C8;
  --panel:#213655; --panel-edge:#0A1525;
  --cabinet:#2E5894; --cabinet-2:#1C3968; --cab-edge:#081221; --cab-shadow:rgba(0,0,0,.6);
  --star-off:#4A5D78; --scrim:rgba(2,8,18,.68); color-scheme:dark }

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:linear-gradient(180deg,var(--sky),var(--sky-2));color:var(--ink);
  font:600 15px/1.35 var(--font);overscroll-behavior:none;-webkit-text-size-adjust:100%}
.app{height:100%;min-height:400px;display:flex;flex-direction:column}

/* control bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{margin:0 auto 0 0;font:800 26px/1 var(--font);letter-spacing:-.01em;white-space:nowrap}
.brand b{font-weight:800;color:var(--nc)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.group{display:flex;align-items:center;gap:6px}
.cap{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.readout{min-width:66px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.btn{font:800 15px/1 var(--font);color:var(--ink);background:var(--panel);border:0;border-radius:14px;min-height:44px;min-width:44px;
  padding:0 14px;box-shadow:0 3px 0 var(--panel-edge);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--panel-edge)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:3px solid var(--n-a);outline-offset:2px}
.btn[aria-pressed="true"],.btn.primary{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 var(--sun-edge)}
.btn[aria-pressed="true"]:active,.btn.primary:active{box-shadow:0 1px 0 var(--sun-edge)}
.btn.big{min-height:60px;padding:0 30px;font-size:21px;border-radius:20px}
.tilt{display:none;flex-basis:100%;margin:0;font-size:13px;color:var(--muted)}
@media (orientation:portrait) and (max-width:900px){.tilt{display:block}}

/* cabinet */
.piano{flex:1;min-height:300px;display:flex;flex-direction:column;
  margin:0 max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  padding:12px 12px 14px;border-radius:24px 24px 16px 16px;
  background:linear-gradient(180deg,var(--cabinet),var(--cabinet-2));
  box-shadow:0 6px 0 var(--cab-edge),0 22px 30px -14px var(--cab-shadow)}
.stand{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:10px 14px;min-height:84px;display:flex;align-items:center}
.stand-idle,.stand-song{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;width:100%;min-width:0}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:0 1 250px}
.meta strong{font:800 18px/1.15 var(--font)}
.meta span{font-size:13px;color:var(--paper-muted)}
.prog{height:6px;border-radius:3px;background:var(--paper-line);margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:3px;background:var(--n-g);transition:width .2s}
.lane,.trail{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;min-height:60px;overflow:hidden;padding:4px 8px}
.trail{justify-content:flex-end}
.step{display:flex;flex:none;align-items:center}
.bub{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--nc);color:var(--chip-ink);font:800 13px/1 var(--font)}
.step .bub + .bub{margin-left:-8px}
.step.cur .bub{width:52px;height:52px;font-size:20px;box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--nc)}
.step.cur{margin:0 6px}
.step.far{opacity:.55}
.trail .bub{animation:pop .18s ease-out}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stand .btn{min-height:40px;font-size:14px;padding:0 12px}
.felt{height:8px;margin-top:10px;border-radius:4px 4px 0 0;
  background:linear-gradient(90deg,var(--n-c),var(--n-d),var(--n-e),var(--n-f),var(--n-g),var(--n-a),var(--n-b))}

/* keys */
.keys{--kw:60px;--chip:clamp(15px,calc(var(--kw)*.62),40px);position:relative;flex:1;min-height:170px;background:var(--ebony);
  border-radius:0 0 10px 10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.whites{display:flex;height:100%}
.key{-webkit-tap-highlight-color:transparent}
.white{position:relative;flex:1;min-width:0;height:100%;border-right:1px solid var(--ivory-edge);border-radius:0 0 7px 7px;
  background:linear-gradient(180deg,var(--ivory-2) 0,var(--ivory) 10%,var(--ivory) 100%);
  box-shadow:inset 0 -9px 0 var(--ivory-2),inset 0 -10px 0 var(--ivory-edge)}
.white.down{background:linear-gradient(180deg,var(--ivory-2) 0,var(--ivory) 30%,color-mix(in srgb,var(--nc) 38%,var(--ivory)) 100%);
  box-shadow:inset 0 -3px 0 var(--ivory-edge),inset 0 8px 12px -6px var(--press-shade)}
.black{position:absolute;top:0;height:61%;z-index:2;border-radius:0 0 6px 6px;
  background:linear-gradient(180deg,var(--ebony-2) 0,var(--ebony) 12%,var(--ebony) 100%);
  box-shadow:inset 0 -10px 0 var(--ebony-lip),inset 2px 0 0 var(--ebony-lip),inset -2px 0 0 var(--ebony-lip),0 4px 6px var(--press-shade)}
.black.down{height:60%;background:linear-gradient(180deg,var(--ebony) 0,color-mix(in srgb,var(--nc) 55%,var(--ebony)) 100%);
  box-shadow:inset 0 -3px 0 var(--ebony-lip),0 1px 2px var(--press-shade)}
.lab{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:var(--chip);height:var(--chip);border-radius:50%;
  display:grid;place-items:center;background:var(--nc);color:var(--chip-ink);font:800 calc(var(--chip)*.42)/1 var(--font);
  white-space:nowrap;pointer-events:none}
.white.down .lab{bottom:13px}
.black .lab{bottom:14px;width:auto;height:auto;background:none;color:var(--ivory);font-size:calc(var(--chip)*.36)}
.lab:empty{display:none}
.keys[data-labels="off"] .lab{display:none}
.keys[data-labels="off"] .white.target .lab{display:grid}
.white.target{background:linear-gradient(180deg,var(--ivory) 0,color-mix(in srgb,var(--nc) 22%,var(--ivory)) 45%,color-mix(in srgb,var(--nc) 62%,var(--ivory)) 100%)}
.black.target{background:linear-gradient(180deg,var(--ebony-2) 0,var(--nc) 100%)}
.key.target::after{content:"";position:absolute;left:50%;top:76%;width:calc(var(--chip)*.8);height:calc(var(--chip)*.8);border-radius:50%;
  background:var(--nc);border:3px solid var(--ivory);transform:translate(-50%,-50%);animation:bob .6s ease-in-out infinite alternate;pointer-events:none}
.black.target::after{top:62%}
.key.oops{animation:shake .28s}
.nc{--nc:var(--n-c)} .nd{--nc:var(--n-d)} .ne{--nc:var(--n-e);--chip-ink:var(--chip-ink-dark)} .nf{--nc:var(--n-f)}
.ng{--nc:var(--n-g)} .na{--nc:var(--n-a)} .nb{--nc:var(--n-b)}
@keyframes bob{to{transform:translate(-50%,-95%)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes pop{from{transform:scale(.4)}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.card{background:var(--panel);color:var(--ink);border-radius:26px;padding:22px;width:100%;max-width:440px;max-height:100%;overflow:auto;
  box-shadow:0 8px 0 var(--panel-edge)}
.card.center{text-align:center}
.card.wide{max-width:820px}
.card h2{margin:0 0 6px;font:800 28px/1.1 var(--font);text-wrap:balance}
.card h3{margin:18px 0 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0 0 16px;color:var(--muted)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-head h2{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tune{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:72px;padding:12px 14px;border-radius:18px;cursor:pointer;
  font:800 16px/1.15 var(--font);color:var(--ink);background:color-mix(in srgb,var(--nc) 14%,var(--panel));
  border:2px solid color-mix(in srgb,var(--nc) 55%,var(--panel));touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tune:active{transform:translateY(2px)}
.tune:focus-visible{outline:3px solid var(--n-a);outline-offset:2px}
.stars{color:var(--star-off);font-size:15px;letter-spacing:2px;line-height:1}
.stars b{color:var(--star);font-weight:400}
.stars.huge{font-size:54px;letter-spacing:6px;margin-bottom:10px}
@media (max-width:620px){
  .brand{font-size:22px} .cap{display:none} .readout{min-width:56px;font-size:13px}
  .btn{padding:0 10px;font-size:14px} .meta{flex-basis:100%}
}
/* phones held sideways: very little height, so everything above the keys gets compact */
@media (max-height:500px){
  .app{min-height:0}
  .bar{padding-block:6px;gap:6px 8px;flex-wrap:nowrap}
  .controls{flex-wrap:nowrap;gap:6px 8px}
  .brand{font-size:18px} .cap,.tilt{display:none} .readout{min-width:48px;font-size:13px}
  .btn{min-height:36px;min-width:36px;padding:0 9px;font-size:13px;border-radius:11px;white-space:nowrap}
  .piano{min-height:0;padding:6px 8px 8px;margin-bottom:8px;border-radius:16px 16px 12px 12px}
  .stand{min-height:0;padding:4px 10px;border-radius:10px}
  .stand-idle,.stand-song{flex-wrap:nowrap;gap:10px}
  .meta{flex:0 1 190px} .meta strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta span{display:none} .prog{margin-top:3px;height:4px}
  .lane,.trail{min-height:44px;padding:2px 6px;gap:6px}
  .bub{width:28px;height:28px;font-size:12px}
  .step.cur .bub{width:36px;height:36px;font-size:15px;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--nc)}
  .acts{flex-wrap:nowrap;gap:6px} .stand .btn{min-height:32px;font-size:12px;padding:0 8px}
  .felt{height:5px;margin-top:6px}
  .keys{min-height:110px} .lab{bottom:12px} .white.down .lab{bottom:8px} .black .lab{bottom:11px}
  .card{padding:14px} .card h2{font-size:22px} .card p{margin-bottom:10px} .btn.big{min-height:46px;font-size:17px}
  .stars.huge{font-size:34px;margin-bottom:4px} .tune{min-height:56px;padding:8px 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <h1 class="brand"><b class="nc">L</b><b class="nd">a</b><b class="ng">y</b><b class="na">l</b><b class="nb">a</b><b class="nf">’s</b> Piano</h1>
    <div class="controls">
      <div class="group" role="group" aria-label="Octave">
        <span class="cap">Octave</span>
        <button class="btn" id="octDown" aria-label="Lower notes">◀</button>
        <span class="readout" id="octRead">C4–C6</span>
        <button class="btn" id="octUp" aria-label="Higher notes">▶</button>
      </div>
      <div class="group" role="group" aria-label="Key size">
        <span class="cap">Key size</span>
        <button class="btn" id="sizeDown" aria-label="Smaller keys, more of them">−</button>
        <span class="readout" id="sizeRead">15 keys</span>
        <button class="btn" id="sizeUp" aria-label="Bigger keys, fewer of them">+</button>
      </div>
      <button class="btn" id="labelBtn">Labels: ABC</button>
      <button class="btn" id="sustainBtn" aria-pressed="false">Sustain</button>
      <button class="btn" id="fsBtn" hidden>Full screen</button>
      <button class="btn primary" id="songsBtn">Songs</button>
    </div>
    <p class="tilt">Turn the iPad sideways for bigger keys.</p>
  </header>

  <main class="piano">
    <div class="stand">
      <div class="stand-idle" id="idle">
        <div class="meta"><strong>Free play</strong><span>Press any keys you like. Tap Songs to learn a tune.</span></div>
        <div class="trail" id="trail" aria-hidden="true"></div>
      </div>
      <div class="stand-song" id="songUI" hidden>
        <div class="meta"><strong id="songTitle"></strong><span id="songTip"></span><div class="prog"><i id="prog"></i></div></div>
        <div class="lane" id="lane"></div>
        <div class="acts">
          <button class="btn" id="listenBtn">Listen</button>
          <button class="btn" id="restartBtn">Start over</button>
          <button class="btn" id="closeSong">Close</button>
        </div>
      </div>
    </div>
    <div class="felt"></div>
    <div class="keys" id="keys" data-labels="abc" aria-label="Piano keyboard"></div>
  </main>
</div>

<div class="overlay" id="sheet" hidden>
  <div class="card wide" role="dialog" aria-labelledby="sheetH">
    <div class="card-head"><h2 id="sheetH">Pick something to play</h2><button class="btn" id="sheetClose">Close</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="overlay" id="done" hidden>
  <div class="card center" role="dialog" aria-labelledby="doneH">
    <div class="stars huge" id="doneStars"></div>
    <h2 id="doneH"></h2><p id="doneP"></p>
    <div class="row"><button class="btn" id="againBtn">Play it again</button><button class="btn primary" id="anotherBtn">Pick another</button></div>
  </div>
</div>

<div class="overlay" id="start">
  <div class="card center" role="dialog" aria-labelledby="startH">
    <h2 id="startH">Hi Layla!</h2>
    <p>Your piano is ready. Turn the sound up, then tap the button.</p>
    <button class="btn primary big" id="startBtn">Start playing</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const COLOR=['c','c','d','d','e','f','f','g','g','a','a','b'];
const LETTER=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const SOLF=['Do','','Re','','Mi','Fa','','Sol','','La','','Ti'];
const WHITE=[1,0,1,0,1,1,0,1,0,1,0,1];
const BLACK_NUDGE={1:-.08,3:.08,6:-.1,8:0,10:.1};
const SIZES=[8,10,12,15,18,22,29];
const LABEL_MODES=['abc','solfege','off'], LABEL_TEXT={abc:'Labels: ABC',solfege:'Labels: Do Re Mi',off:'Labels: Off'};

const store={
  get(k,d){try{const v=localStorage.getItem('laylaPiano.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('laylaPiano.'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- sound: made on the device, nothing to download ---------- */
let ctx=null,master=null,noiseBuf=null,waves=[];
const voices=new Map();
let sustain=false;

function makeWave(count,rolloff){
  const re=new Float32Array(count+1),im=new Float32Array(count+1);
  for(let n=1;n<=count;n++)im[n]=Math.abs(Math.sin(n*Math.PI*.13))/Math.pow(n,rolloff);
  return ctx.createPeriodicWave(re,im);
}
function initAudio(){
  if(ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  try{ctx=new AC({latencyHint:'interactive'})}catch(e){ctx=new AC()}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-16;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.2;
  master=ctx.createGain();master.gain.value=.9;
  master.connect(comp);comp.connect(ctx.destination);
  // a little room around the sound
  const len=Math.floor(ctx.sampleRate*1.6),ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
  const room=ctx.createConvolver();room.buffer=ir;
  const wet=ctx.createGain();wet.gain.value=.14;
  master.connect(room);room.connect(wet);wet.connect(comp);
  const nl=Math.floor(ctx.sampleRate*.08);noiseBuf=ctx.createBuffer(1,nl,ctx.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;
  waves=[makeWave(40,1.05),makeWave(28,1.3),makeWave(16,1.6),makeWave(8,2)];
}
function wake(){initAudio();if(ctx&&ctx.state!=='running'){const p=ctx.resume();if(p&&p.catch)p.catch(()=>{})}}

function letGo(v,fast){
  const t=ctx.currentTime,g=v.out.gain;
  if(g.cancelAndHoldAtTime)g.cancelAndHoldAtTime(t);else{const cur=g.value;g.cancelScheduledValues(t);g.setValueAtTime(cur,t)}
  g.setTargetAtTime(0,t,fast?.012:.085);
  v.oscs.forEach(o=>{try{o.stop(t+(fast?.1:.7))}catch(e){}});
}
function noteOn(m,vel){
  if(!ctx)return;
  const old=voices.get(m);if(old){letGo(old,true);voices.delete(m)}
  const t=ctx.currentTime,f=440*Math.pow(2,(m-69)/12);
  const out=ctx.createGain(),lp=ctx.createBiquadFilter();
  lp.type='lowpass';lp.Q.value=.5;
  lp.frequency.setValueAtTime(Math.min(16000,f*(5+14*vel)+600),t);
  lp.frequency.setTargetAtTime(Math.min(12000,f*2.2+250),t+.01,m<55?.55:.28);
  const peak=.2*vel*(m<48?1.15:1),ring=Math.max(.35,2.4-(m-48)*.035);
  out.gain.setValueAtTime(0,t);
  out.gain.linearRampToValueAtTime(peak,t+.005);
  out.gain.setTargetAtTime(peak*.5,t+.005,.12);
  out.gain.setTargetAtTime(0,t+.3,ring);
  const wave=waves[m<45?0:m<62?1:m<80?2:3],oscs=[];
  for(const cents of[-1.4,1.7]){            // two strings, very slightly apart
    const o=ctx.createOscillator();o.setPeriodicWave(wave);o.frequency.value=f;o.detune.value=cents;
    o.connect(lp);o.start(t);o.stop(t+ring*6+1);oscs.push(o);
  }
  lp.connect(out);out.connect(master);
  const n=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();   // the hammer's knock
  n.buffer=noiseBuf;bp.type='bandpass';bp.Q.value=.8;bp.frequency.value=Math.min(6000,Math.max(700,f*2.5));
  ng.gain.setValueAtTime(.16*vel,t);ng.gain.exponentialRampToValueAtTime(.001,t+.045);
  n.connect(bp);bp.connect(ng);ng.connect(master);n.start(t);n.stop(t+.06);
  const v={out,oscs,sus:false};
  oscs[0].onended=()=>{try{out.disconnect()}catch(e){} if(voices.get(m)===v)voices.delete(m)};
  voices.set(m,v);
}
function noteOff(m){
  const v=voices.get(m);if(!v||!ctx)return;
  if(sustain){v.sus=true;return}
  letGo(v,false);voices.delete(m);
}

/* ---------- keyboard ---------- */
const kb=$('keys');
const els=new Map(),held=new Map(),ptr=new Map();
let octave=store.get('octave',4),size=store.get('size',window.innerWidth<620?8:15),labels=store.get('labels','abc');
if(!SIZES.includes(size))size=15;
if(!LABEL_MODES.includes(labels))labels='abc';
if(!(octave>=1&&octave<=7))octave=4;

const startMidi=o=>12*(o+1);
function lastWhite(o,n){let m=startMidi(o),c=0;for(;;m++){if(WHITE[m%12]&&++c===n)return m}}
function whitesUpTo(o,top){let c=0;for(let m=startMidi(o);m<=top;m++)c+=WHITE[m%12];return c}
function noteName(m,mode){const pc=m%12;return mode==='solfege'&&SOLF[pc]?SOLF[pc]:LETTER[pc]}
function keyLabel(m){
  const pc=m%12;
  if(labels==='solfege')return SOLF[pc];
  return pc===0?'C'+(Math.floor(m/12)-1):LETTER[pc];
}

function build(){
  releaseAll();
  while(octave>1&&lastWhite(octave,size)>108)octave--;
  const first=startMidi(octave),last=lastWhite(octave,size);
  kb.textContent='';els.clear();
  const whites=document.createElement('div');whites.className='whites';kb.appendChild(whites);
  let w=0;
  for(let m=first;m<=last;m++){
    const pc=m%12,el=document.createElement('div'),lab=document.createElement('span');
    lab.className='lab';lab.textContent=keyLabel(m);el.appendChild(lab);el.dataset.m=m;
    if(WHITE[pc]){el.className='key white n'+COLOR[pc];whites.appendChild(el);w++}
    else{
      el.className='key black n'+COLOR[pc];
      el.style.left=((w+BLACK_NUDGE[pc]-.3)/size*100)+'%';el.style.width=(.6/size*100)+'%';
      kb.appendChild(el);
    }
    els.set(m,el);
  }
  kb.dataset.labels=labels;
  measure();
  $('octRead').textContent='C'+octave+'–'+LETTER[last%12]+(Math.floor(last/12)-1);
  $('sizeRead').textContent=size+' keys';
  $('octDown').disabled=octave<=1;
  $('octUp').disabled=lastWhite(octave+1,size)>108;
  $('sizeUp').disabled=SIZES.indexOf(size)===0;
  $('sizeDown').disabled=SIZES.indexOf(size)===SIZES.length-1;
  $('labelBtn').textContent=LABEL_TEXT[labels];
  store.set('octave',octave);store.set('size',size);store.set('labels',labels);
  showTargets();
}
function measure(){kb.style.setProperty('--kw',(kb.clientWidth/size)+'px')}
if(window.ResizeObserver)new ResizeObserver(measure).observe(kb);else window.addEventListener('resize',measure);

function press(m,vel,how){
  const c=held.get(m)||0;held.set(m,c+1);if(c)return;
  noteOn(m,vel);
  const el=els.get(m);if(el)el.classList.add('down');
  if(how){addTrail(m);practiceHit(m,how==='slide')}
}
function lift(m){
  const c=held.get(m)||0;
  if(c>1){held.set(m,c-1);return}
  held.delete(m);noteOff(m);
  const el=els.get(m);if(el)el.classList.remove('down');
}
function releaseAll(){for(const m of[...held.keys()]){held.set(m,1);lift(m)}ptr.clear()}

function keyAt(x,y){
  const el=document.elementFromPoint(x,y),k=el&&el.closest?el.closest('.key'):null;
  return k&&kb.contains(k)?+k.dataset.m:null;
}
function touchForce(e,m){           // lower down the key plays a little louder, like a real lever
  const el=els.get(m);if(!el)return .8;
  const r=el.getBoundingClientRect();
  return .6+.38*Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
}
kb.addEventListener('pointerdown',e=>{
  e.preventDefault();wake();
  const m=keyAt(e.clientX,e.clientY);if(m==null)return;
  ptr.set(e.pointerId,m);press(m,touchForce(e,m),'tap');
});
window.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;
  const cur=ptr.get(e.pointerId),m=keyAt(e.clientX,e.clientY);
  if(m==null||m===cur)return;
  lift(cur);ptr.set(e.pointerId,m);press(m,.72,'slide');
});
function pointerEnd(e){if(!ptr.has(e.pointerId))return;const m=ptr.get(e.pointerId);ptr.delete(e.pointerId);lift(m)}
window.addEventListener('pointerup',pointerEnd);
window.addEventListener('pointercancel',pointerEnd);
kb.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
kb.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();else if(ctx)wake()});

// a computer keyboard works too, handy when trying it on a laptop
const TYPE_KEYS=['a','w','s','e','d','f','t','g','y','h','u','j','k','o','l','p',';'];
const typed=new Map();
window.addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.closest&&e.target.closest('button'))return;
  const i=TYPE_KEYS.indexOf(e.key.toLowerCase());if(i<0||typed.has(i))return;
  const m=startMidi(octave)+i;if(!els.has(m))return;
  wake();typed.set(i,m);press(m,.8,'tap');
});
window.addEventListener('keyup',e=>{
  const i=TYPE_KEYS.indexOf(e.key.toLowerCase());if(!typed.has(i))return;
  lift(typed.get(i));typed.delete(i);
});

$('octDown').onclick=()=>{octave--;build()};
$('octUp').onclick=()=>{octave++;build()};
$('sizeUp').onclick=()=>{size=SIZES[Math.max(0,SIZES.indexOf(size)-1)];build()};
$('sizeDown').onclick=()=>{size=SIZES[Math.min(SIZES.length-1,SIZES.indexOf(size)+1)];build()};
$('labelBtn').onclick=()=>{labels=LABEL_MODES[(LABEL_MODES.indexOf(labels)+1)%LABEL_MODES.length];build();renderLane()};
$('sustainBtn').onclick=()=>{
  sustain=!sustain;$('sustainBtn').setAttribute('aria-pressed',sustain);
  if(!sustain&&ctx)for(const[m,v]of[...voices])if(v.sus&&!held.has(m)){letGo(v,false);voices.delete(m)}
};

const goFull=root.requestFullscreen||root.webkitRequestFullscreen;
const installed=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);

      else{const p=goFull.call(root);if(p&&p.catch)p.catch(()=>{})}
    }catch(e){}
  };
}

const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function toMidi(s){
  const x=/^([A-G])([#b]?)(\d)$/.exec(s);
  return 12*(+x[3]+1)+SEMI[x[1]]+(x[2]==='#'?1:x[2]==='b'?-1:0);
}
function parseTune(t){
  return t.notes.split(/\s+/).map(tok=>{
    const[names,dur]=tok.split(':');
    return{notes:names.split('+').map(toMidi),dur:dur?+dur:1};
  });
}

let tune=null,steps=[],at=0,need=new Set(),misses=0,mode='idle',timers=[],updateWaiting=false;
const best=store.get('best',{});
const starsFor=n=>n===0?3:n<=3?2:1;
function starsHTML(n){let h='';for(let i=1;i<=3;i++)h+=i<=n?'<b>★</b>':'★';return h}

const SECTIONS=[['lesson','First lessons'],['song','Songs'],['holiday','Holiday songs'],['classical','First classical pieces']];
function fillSheet(){
  const body=$('sheetBody');body.textContent='';
  for(const[key,name]of SECTIONS){
    const h=document.createElement('h3'),grid=document.createElement('div');
    h.textContent=name;grid.className='grid';body.append(h,grid);
    TUNES.filter(t=>(t.lesson?'lesson':t.g||'song')===key).forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='tune n'+['c','d','g','a','b','f'][i%6];
      b.innerHTML='<span></span><span class="stars" aria-label="'+(best[t.id]||0)+' of 3 stars">'+starsHTML(best[t.id]||0)+'</span>';
      b.firstChild.textContent=t.title;
      b.onclick=()=>{$('sheet').hidden=true;openTune(t)};
      grid.appendChild(b);
    });
  }
}
function fitRange(){
  let lo=200,hi=0;
  steps.forEach(s=>s.notes.forEach(n=>{lo=Math.min(lo,n);hi=Math.max(hi,n)}));
  if(lo>=startMidi(octave)&&hi<=lastWhite(octave,size))return;
  octave=Math.floor(lo/12)-1;
  const whites=whitesUpTo(octave,hi);
  if(whites>size)size=SIZES.find(s=>s>=whites)||SIZES[SIZES.length-1];
}
function openTune(t){
  wake();tune=t;steps=parseTune(t);
  $('idle').hidden=true;$('songUI').hidden=false;$('songTitle').textContent=t.title;
  fitRange();build();practice();
}
function stopTimers(){timers.forEach(clearTimeout);timers=[];for(const s of steps)for(const n of s.notes)if(!held.has(n)){noteOff(n);const el=els.get(n);if(el)el.classList.remove('down')}}
function clearTargets(){els.forEach(el=>el.classList.remove('target'))}
function showTargets(){
  clearTargets();
  if(mode==='practice')need.forEach(n=>{const el=els.get(n);if(el)el.classList.add('target')});
}
function renderLane(){
  if(!tune)return;
  const lane=$('lane');lane.textContent='';
  steps.slice(at,at+9).forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='step'+(i===0?' cur':i>4?' far':'');
    d.style.marginRight=Math.round(Math.max(0,s.dur-1)*12)+'px';
    s.notes.forEach(n=>{
      const b=document.createElement('span');
      b.className='bub n'+COLOR[n%12];b.textContent=noteName(n,labels);d.appendChild(b);
    });
    lane.appendChild(d);
  });
  $('prog').style.width=(steps.length?at/steps.length*100:0)+'%';
}
function setStep(i){
  at=i;
  if(mode==='practice'){
    if(at>=steps.length){finish();return}
    need=new Set(steps[at].notes);showTargets();
  }
  renderLane();
}
function practice(){
  stopTimers();mode='practice';misses=0;
  $('songTip').textContent=tune.tip||'Your turn. Press the glowing key.';
  $('listenBtn').textContent='Listen';
  setStep(0);
}
function listen(){
  stopTimers();mode='listen';clearTargets();
  $('songTip').textContent='Listen first, then it is your turn.';
  $('listenBtn').textContent='Stop';
  let t=250;
  steps.forEach((s,i)=>{
    const len=s.dur*tune.ms;
    timers.push(setTimeout(()=>{
      setStep(i);
      s.notes.forEach(n=>{noteOn(n,.75);const el=els.get(n);if(el)el.classList.add('down')});
    },t));
    timers.push(setTimeout(()=>{
      s.notes.forEach(n=>{if(!held.has(n)){noteOff(n);const el=els.get(n);if(el)el.classList.remove('down')}});
    },t+len*.9));
    t+=len;
  });
  timers.push(setTimeout(practice,t+350));
}
function practiceHit(m,slide){
  if(mode!=='practice'||at>=steps.length)return;
  if(need.has(m)){
    need.delete(m);
    const el=els.get(m);if(el)el.classList.remove('target');
    if(!need.size)setStep(at+1);
  }else if(!slide&&!steps[at].notes.includes(m)){
    misses++;
    const el=els.get(m);
    if(el){el.classList.remove('oops');void el.offsetWidth;el.classList.add('oops')}
  }
}
function finish(){
  mode='done';clearTargets();renderLane();$('prog').style.width='100%';
  const n=starsFor(misses);
  if(n>(best[tune.id]||0)){best[tune.id]=n;store.set('best',best)}
  $('doneStars').innerHTML=starsHTML(n);
  $('doneH').textContent=n===3?'Perfect!':n===2?'Well done!':'You did it!';
  $('doneP').textContent='You played '+tune.title+(misses?' with '+misses+(misses===1?' slip.':' slips.'):' without a single slip.');
  timers.push(setTimeout(()=>{$('done').hidden=false},450));
}
function closeTune(){
  stopTimers();mode='idle';tune=null;steps=[];need=new Set();clearTargets();
  $('songUI').hidden=true;$('idle').hidden=false;
  if(updateWaiting)location.reload();
}
function addTrail(m){
  if(mode!=='idle')return;
  const tr=$('trail'),b=document.createElement('span');
  b.className='bub n'+COLOR[m%12];b.textContent=noteName(m,labels);tr.appendChild(b);
  while(tr.children.length>10)tr.removeChild(tr.firstChild);
}
$('songsBtn').onclick=()=>{wake();fillSheet();$('sheet').hidden=false};
$('sheetClose').onclick=()=>{$('sheet').hidden=true};
$('listenBtn').onclick=()=>{wake();if(mode==='listen')practice();else listen()};
$('restartBtn').onclick=()=>{wake();practice()};
$('closeSong').onclick=closeTune;
$('againBtn').onclick=()=>{$('done').hidden=true;practice()};
$('anotherBtn').onclick=()=>{$('done').hidden=true;closeTune();fillSheet();$('sheet').hidden=false};

build();

// Installed copy only: keep every file on the iPad so it opens with no internet.
if(document.querySelector('link[rel="manifest"]')&&'serviceWorker' in navigator){
  // When a newer copy arrives, show it straight away (or as soon as the current song is closed).
  const hadCopy=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadCopy)return;
    if(mode==='idle'&&!held.size)location.reload();else updateWaiting=true;
  });
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
})();
